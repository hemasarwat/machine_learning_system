[project]
name = "ml-system-packages"
version = "0.1.0"
description = ""
authors = [
    {name = "hemasarwat",email = "hema.sarwat5@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12, <3.15"
dependencies = [
    "numpy (>=2.4.2,<3.0.0)",
    "pandas (<3)",
    "metaflow (>=2.19.19,<3.0.0)",
    "torch (>=2.10.0,<3.0.0)",
    "torchaudio (>=2.10.0,<3.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "ipytest (>=0.14.2,<0.15.0)",
    "flask (>=3.1.3,<4.0.0)",
    "sagemaker[local] (>=3.4.1,<4.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "ruff (>=0.15.2,<0.16.0)",
    "nbformat (>=5.10.4,<6.0.0)",
    "nbdev (>=3.0.12,<4.0.0)",
    "nbclient (>=0.10.4,<0.11.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
    "comet-ml (>=3.56.0,<4.0.0)",
    "seaborn>=0.13.2,<0.14.0"
]

[tool.poetry]
packages = [{include = "ml_system_packages", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
