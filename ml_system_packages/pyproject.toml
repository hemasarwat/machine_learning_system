[project]
name = "ml-system-packages"
version = "0.1.0"
description = ""
authors = [
    {name = "hemasarwat",email = "hema.sarwat5@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12, <3.15"
dependencies = [
    "numpy (>=2.4.2,<3.0.0)",
    "pandas (>=3.0.1,<4.0.0)",
    "metaflow (>=2.19.19,<3.0.0)",
    "torch (>=2.10.0,<3.0.0)",
    "torchaudio (>=2.10.0,<3.0.0)"
]

[tool.poetry]
packages = [{include = "ml_system_packages", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
